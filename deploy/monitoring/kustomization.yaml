apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply with: kubectl apply -k deploy/monitoring
# The two HelmCharts install into the monitoring namespace from kube-system,
# where k3s's Helm controller runs their install jobs.
resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml
  - alert-bridge.yaml

configMapGenerator:
  # Named in prometheus.yaml and grafana.yaml by these exact names, so no
  # hash suffix. Prometheus's reload sidecar and Grafana's provisioner both
  # pick up a changed file without a restart.
  - name: prometheus-second-brain-rules
    namespace: monitoring
    files:
      - rules/second-brain.yml
    options:
      disableNameSuffixHash: true
  - name: grafana-dashboards-second-brain
    namespace: monitoring
    files:
      - dashboards/second-brain.json
    options:
      disableNameSuffixHash: true
  # Hashed, so a change to the script rolls the bridge's pod.
  - name: alert-bridge
    namespace: monitoring
    files:
      - alert_bridge.py
