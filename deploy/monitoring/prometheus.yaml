# Prometheus with Alertmanager, kube-state-metrics, node-exporter and a
# Pushgateway, from the prometheus-community chart rather than the full
# kube-prometheus-stack: no operator, no CRDs, a fraction of the memory.
# k3s's built-in Helm controller installs it; nothing on the node needs helm.
#
# Nothing here is reachable from outside the node. Grafana reads Prometheus
# over the cluster network, and the owner reaches Grafana through the SSM
# tunnel (`python deploy/ops.py tunnel --to grafana`).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: prometheus
  version: 29.31.1
  targetNamespace: monitoring
  valuesContent: |-
    server:
      fullnameOverride: prometheus-server
      global:
        scrape_interval: 30s
        evaluation_interval: 30s
      # A week is enough to compare a day with the one before it and to
      # replay a game day. The size cap keeps a runaway series count from
      # filling the node's disk, which is itself an alert.
      retention: 7d
      retentionSize: 1500MB
      persistentVolume:
        size: 4Gi
        storageClass: local-path
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 768Mi
      # The alert rules live in their own file (rules/second-brain.yml),
      # tested with promtool in CI, and reach the pod as a ConfigMap.
      extraConfigmapMounts:
        - name: second-brain-rules
          mountPath: /etc/second-brain-rules
          configMap: prometheus-second-brain-rules
          readOnly: true
    configmapReload:
      prometheus:
        # Watch the rules too, so a rule change reloads without a restart:
        # the mount alone isn't watched, the directory has to be listed.
        extraVolumeDirs:
          - /etc/second-brain-rules
        extraConfigmapMounts:
          - name: second-brain-rules
            mountPath: /etc/second-brain-rules
            configMap: prometheus-second-brain-rules
            readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
    serverFiles:
      prometheus.yml:
        rule_files:
          - /etc/config/recording_rules.yml
          - /etc/config/alerting_rules.yml
          - /etc/second-brain-rules/*.yml
    alertmanager:
      fullnameOverride: alertmanager
      # Silences and notification history are cheap to lose: the node is
      # rebuilt between work sessions anyway.
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 96Mi
      config:
        route:
          receiver: github
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
        receivers:
          # alert-bridge.yaml turns each alert group into a GitHub issue:
          # opened when it fires, commented while it repeats, closed when
          # it resolves.
          - name: github
            webhook_configs:
              - url: http://alert-bridge.monitoring.svc:9095/alerts
                send_resolved: true
                max_alerts: 20
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi
    prometheus-pushgateway:
      fullnameOverride: pushgateway
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
