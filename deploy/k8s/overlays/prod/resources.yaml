# Both namespaces share one 8 GB node, so prod asks for what it needs rather
# than what it can get away with: the scheduler holds this memory for it, and
# under pressure the kubelet evicts the pod furthest above its request, which
# is staging. Staging measured a 999 MiB peak under queries on 2026-09-19
# (see base/deployment.yaml), so prod's request covers that peak and its
# limit doubles it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-brain
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
