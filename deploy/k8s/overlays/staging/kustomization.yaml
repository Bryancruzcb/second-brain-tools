apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging

# Staging runs the base as written: it takes the deploy first, gets scored by
# the gate, and only then does prod see the same image.
resources:
  - namespace.yaml
  - ../../base

images:
  - name: ghcr.io/bryancruzcb/second-brain-backend
    newTag: unset
