apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-brain
  labels:
    app.kubernetes.io/name: second-brain
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      # The old pod keeps serving until the new one is ready, which takes as
      # long as the models take to load. Both pods read the same store; that
      # is safe because a reader reopens its view when another process writes
      # (PR #25), and neither of them writes.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: second-brain
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: second-brain
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          # The tag is set per deploy to the commit SHA. "unset" is not a tag
          # that exists in GHCR, so applying an overlay without setting it
          # fails loudly on the pull instead of running yesterday's image.
          image: ghcr.io/bryancruzcb/second-brain-backend:unset
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: second-brain-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Liveness answers from a cached blob the moment uvicorn binds, so
          # it means "the process is alive", which is what a restart decision
          # should rest on.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          # Readiness is the strict variant: 503 until the embedding model,
          # the Chroma collection, the lexical index and the reranker have
          # all loaded and the collection holds at least one chunk, so a
          # fresh volume stays unready until the first indexer job writes.
          # Without ?strict=1 the endpoint answers 200 with
          # {"ready": false} and the pod would take traffic while it still
          # served vector-only results at the 70% hit-rate.
          #
          # failureThreshold x periodSeconds allows ten minutes, which covers
          # a cold model cache on the first rollout into a fresh namespace.
          readinessProbe:
            httpGet:
              path: /api/ready?strict=1
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 40
          resources:
            # Measured on staging 2026-09-19 from the container's cgroup:
            # 469 MiB with its models loaded and an empty index, 804 MiB
            # with the 5,941-chunk index open, and a 999 MiB peak over 63
            # queries including four at a time, reranking one pair per
            # pass. The request covers the loaded index; the limit is about
            # 1.5 times the peak. With the old whole-pool rerank batch the
            # same pod passed 2 GiB on its second query.
            requests:
              cpu: 250m
              memory: 900Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: second-brain-data
