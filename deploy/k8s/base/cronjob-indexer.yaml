# The nightly index rebuild, in its own pod, from the same image as the API.
#
# An indexer built from different code than the server is how a chunking
# change ships to one and not the other, so it runs `scripts/rebuild_rag_index.py`
# out of the image the API is running.
#
# It writes the Chroma store while the API reads it. That is the real
# incident from this repo replayed on purpose (game-day scenario 3): the API
# notices the write stamp move and reopens its view, which is what PR #25
# added. Nothing here tries to stop the second writer.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: second-brain-indexer
  labels:
    app.kubernetes.io/name: second-brain
    app.kubernetes.io/component: indexer
spec:
  # 06:00 UTC. The desktop's "Second Brain Auto Archive" task runs at 21:00
  # local and the vault sync follows it, which is 04:00 or 05:00 UTC
  # depending on daylight saving, so this sits after both.
  schedule: "0 6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One attempt, then wait for tomorrow. A reindex that failed on a bad
      # file fails the same way on a retry, and the index-age alert is the
      # thing that should speak up, not a retry loop.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: second-brain
            app.kubernetes.io/component: indexer
        spec:
          restartPolicy: Never
          initContainers:
            # Pull the vault copy from S3 with the node's instance role. The
            # API image carries no AWS tooling, and this keeps it that way.
            # --delete matches the desktop: a note that was deleted or newly
            # refused by the secret scan leaves the cloud copy tonight.
            - name: fetch-vault
              image: public.ecr.aws/aws-cli/aws-cli:2.36.46
              command: ["aws"]
              args:
                - s3
                - sync
                - s3://$(VAULT_BUCKET)/vault/
                - /data/vault
                - --delete
                - --only-show-errors
              envFrom:
                - configMapRef:
                    name: second-brain-ops-env
              volumeMounts:
                - name: data
                  mountPath: /data
          containers:
            - name: indexer
              image: ghcr.io/bryancruzcb/second-brain-backend:unset
              command: ["python", "scripts/rebuild_rag_index.py"]
              envFrom:
                - configMapRef:
                    name: second-brain-config
              env:
                # Tell the API to reopen its view when the rebuild finishes,
                # rather than waiting for it to notice on the next query.
                - name: SECOND_BRAIN_API_URL
                  value: http://second-brain:8000
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                # Embedding a full rebuild is the heaviest thing on the node.
                # Two first builds of the 775-file vault on staging peaked at
                # 1,228 and 1,222 MiB (cgroup) and ran on about one CPU for
                # 22 minutes; the nightly incremental run touches only what
                # changed. The request holds that peak for it, the limit
                # leaves about 40 percent for a growing vault.
                requests:
                  cpu: 500m
                  memory: 1280Mi
                limits:
                  cpu: 1500m
                  memory: 1792Mi
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: second-brain-data
