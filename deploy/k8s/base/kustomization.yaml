apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The gate Job is not here on purpose: the pipeline creates one per deploy
# (see ../gate-job.yaml), and a Job in an overlay would re-run on every
# apply and then refuse to be updated.
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - cronjob-indexer.yaml
  - cronjob-canary.yaml

images:
  - name: ghcr.io/bryancruzcb/second-brain-backend
    newTag: unset

# The canary's baseline: the hit rate the same ten questions scored on this
# index, recorded from the desktop through the tunnel with
# `python -m eval.canary --record`. Numbers only, and hashed into the
# ConfigMap's name, so recording a new card rolls the CronJob onto it.
configMapGenerator:
  - name: second-brain-canary-card
    files:
      - canary-card.json
