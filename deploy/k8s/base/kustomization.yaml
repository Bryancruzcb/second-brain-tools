apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The gate Job is not here on purpose: the pipeline creates one per deploy
# (see ../gate-job.yaml), and a Job in an overlay would re-run on every
# apply and then refuse to be updated.
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - cronjob-indexer.yaml

images:
  - name: ghcr.io/bryancruzcb/second-brain-backend
    newTag: unset
