version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OBSIDIAN_VAULT_PATH=/vault
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      # Mount the actual vault as a volume inside the container
      # Using a default fallback path that the user can customize in their .env
      - ${OBSIDIAN_VAULT_PATH:-~/Library/CloudStorage/OneDrive-Personal/Documents/Obsidian Vault}:/vault
      # Persist the vector database index
      - ./.data/chroma_db:/app/chroma_db
      # Persist the health check cache
      - ./.data/health_cache.json:/app/health_cache.json
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
