name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Rust Core Verification ──────────────────────────────────────────────────
  rust-check:
    name: Rust Core (vault-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo Check
        run: cargo check --manifest-path core/Cargo.toml

      - name: Run Tests
        run: cargo test --manifest-path core/Cargo.toml

  # ── FastAPI Backend Verification ────────────────────────────────────────────
  python-check:
    name: FastAPI Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Python Syntax Verification
        run: python -m py_compile backend/main.py backend/config.py backend/retrieval.py backend/lexical.py backend/eval/dataset.py backend/eval/scoring.py backend/eval/scorecard.py backend/eval/run_eval.py backend/eval/sweep_rerankers.py backend/indexer.py backend/scripts/rebuild_rag_index.py

      - name: Backend Tests
        run: python -m pytest backend/tests -q

  # ── Backend Container Verification ──────────────────────────────────────────
  # The image is the only documented deploy artifact and nothing built it until
  # this job existed, so the Dockerfile broke silently while CI stayed green.
  docker-build:
    name: Backend Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: second-brain-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Import Smoke Test
        # Compiling is not the bar. This imports main.py exactly as uvicorn
        # would, which exercises every COPY line and every runtime dependency.
        # It touches no vault and opens no ChromaDB: _load_fast_sync runs in
        # the lifespan, not at import.
        run: |
          docker run --rm --entrypoint python second-brain-backend:ci \
            -c "import main; print('backend imports OK')"

      - name: Assert CPU-only Torch
        # A CUDA resolution still imports and still passes the smoke test. It
        # just adds ~2.5 GB of wheels that cannot run here, so assert it
        # explicitly rather than discovering it in a registry bill.
        run: |
          docker run --rm --entrypoint python second-brain-backend:ci -c "
          import torch, sys
          print('torch', torch.__version__)
          sys.exit(0 if torch.__version__.endswith('+cpu') else 1)"

  # ── Next.js Frontend Verification ───────────────────────────────────────────
  nextjs-check:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Next.js App
        run: |
          cd frontend
          npm run lint --if-present

      - name: Build Next.js Production App
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
