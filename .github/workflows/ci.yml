name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  # Every pull request, whatever it targets. With a branches: filter of main
  # here, a stack of pull requests - each one based on the one below it, which
  # is how the ops work arrives - ran CI on the bottom one only, and the rest
  # merged unverified.
  pull_request:

jobs:
  # ── Rust Core Verification ──────────────────────────────────────────────────
  rust-check:
    name: Rust Core (vault-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo Check
        run: cargo check --manifest-path core/Cargo.toml

      - name: Run Tests
        run: cargo test --manifest-path core/Cargo.toml

  # ── FastAPI Backend Verification ────────────────────────────────────────────
  python-check:
    name: FastAPI Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Python Syntax Verification
        run: python -m py_compile backend/main.py backend/config.py backend/logging_setup.py backend/metrics.py backend/retrieval.py backend/lexical.py backend/eval/dataset.py backend/eval/scoring.py backend/eval/scorecard.py backend/eval/run_eval.py backend/eval/http_eval.py backend/eval/canary.py backend/eval/sweep_rerankers.py backend/indexer.py backend/scripts/rebuild_rag_index.py deploy/sync/sync_vault.py deploy/ops.py deploy/monitoring/alert_bridge.py

      - name: Backend Tests
        run: python -m pytest backend/tests deploy/sync/tests deploy/tests -q

  # ── Backend Container Verification ──────────────────────────────────────────
  # The image is the only documented deploy artifact and nothing built it until
  # this job existed, so the Dockerfile broke silently while CI stayed green.
  docker-build:
    name: Backend Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: second-brain-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Import Smoke Test
        # Compiling is not the bar. This imports main.py exactly as uvicorn
        # would, which exercises every COPY line and every runtime dependency.
        # It touches no vault and opens no ChromaDB: _load_fast_sync runs in
        # the lifespan, not at import.
        run: |
          docker run --rm --entrypoint python second-brain-backend:ci \
            -c "import main; print('backend imports OK')"

      - name: Indexer, Gate and Canary Smoke Test
        # The CronJobs and the gate Job run from this image. --help is enough
        # to prove the copies landed where their sys.path juggling expects:
        # both modules import config, indexer and retrieval from /app before
        # argparse ever runs.
        run: |
          docker run --rm --entrypoint python second-brain-backend:ci             scripts/rebuild_rag_index.py --help > /dev/null
          docker run --rm --entrypoint python second-brain-backend:ci             -m eval.http_eval --help > /dev/null
          docker run --rm --entrypoint python second-brain-backend:ci             -m eval.canary --help > /dev/null
          docker run --rm --entrypoint python second-brain-backend:ci             -c "import eval.run_eval, eval.sweep_rerankers; print('eval modules import OK')"

      - name: Assert CPU-only Torch
        # A CUDA resolution still imports and still passes the smoke test. It
        # just adds ~2.5 GB of wheels that cannot run here, so assert it
        # explicitly rather than discovering it in a registry bill.
        run: |
          docker run --rm --entrypoint python second-brain-backend:ci -c "
          import torch, sys
          print('torch', torch.__version__)
          sys.exit(0 if torch.__version__.endswith('+cpu') else 1)"

  # ── Kubernetes Manifest Verification ────────────────────────────────────────
  # Nothing else reads these files until a deploy applies them to the node, so
  # a typo in a field name would surface as a failed rollout at 3am. kubeconform
  # checks them against the real Kubernetes schemas, and the greps below hold
  # the manifests to the design rules that make the privacy argument work.
  k8s-check:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Render the Overlays
        run: |
          command -v kubectl >/dev/null || {
            VERSION=$(curl -sSL https://dl.k8s.io/release/stable.txt)
            sudo curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$VERSION/bin/linux/amd64/kubectl"
            sudo chmod +x /usr/local/bin/kubectl
          }
          kubectl kustomize deploy/k8s/overlays/staging > /tmp/staging.yaml
          kubectl kustomize deploy/k8s/overlays/prod > /tmp/prod.yaml
          IMAGE=ghcr.io/bryancruzcb/second-brain-backend:ci             envsubst < deploy/k8s/gate-job.yaml > /tmp/gate.yaml
          IMAGE=ghcr.io/bryancruzcb/second-brain-backend:ci             envsubst < deploy/k8s/smoke-job.yaml > /tmp/smoke.yaml

      - name: Validate Against the Kubernetes Schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz             | tar -xz kubeconform
          ./kubeconform -strict -summary /tmp/staging.yaml /tmp/prod.yaml /tmp/gate.yaml /tmp/smoke.yaml

      - name: Node Scripts Parse
        run: |
          # Everything under deploy/ that the pipeline or a game day sends to
          # the node. A script with a syntax error would only show up as a
          # failed step halfway through a deploy.
          find deploy -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Hold the Manifests to the Design
        run: |
          # A moving tag would make a rollback a race with whatever it points
          # at by the time the node pulls.
          ! grep -n ":latest" /tmp/staging.yaml /tmp/prod.yaml /tmp/gate.yaml /tmp/smoke.yaml
          # Nothing from the internet reaches this node, by design.
          ! grep -nE "^kind: Ingress|type: LoadBalancer" /tmp/staging.yaml /tmp/prod.yaml
          # The cloud copy is read-only: the desktop sync is the only writer.
          grep -q 'READ_ONLY: "1"' /tmp/staging.yaml
          grep -q 'READ_ONLY: "1"' /tmp/prod.yaml

  # ── Monitoring Verification ─────────────────────────────────────────────────
  # The monitoring stack is two Helm charts installed by the node's Helm
  # controller, plus the alert rules, dashboards and the GitHub alert bridge.
  # Rendering the charts with the committed values catches a wrong key here
  # instead of on the node (it caught one before the first deploy: Grafana's
  # distroless image can't read __FILE variables), and promtool runs the
  # alert rules against their unit tests.
  monitoring-check:
    name: Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install helm, kubeconform and promtool
        run: |
          curl -sSL https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 linux-amd64/helm
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz \
            | tar -xz --strip-components=1 prometheus-3.14.0.linux-amd64/promtool

      - name: Test the Alert Rules
        run: |
          ./promtool check rules deploy/monitoring/rules/second-brain.yml
          ./promtool test rules deploy/monitoring/rules/second-brain.test.yml

      - name: Render the Charts with the Committed Values
        run: |
          for file in prometheus grafana; do
            manifest=deploy/monitoring/$file.yaml
            yq -r '.spec.valuesContent' "$manifest" > "/tmp/values-$file.yaml"
            ./helm template "$file" "$(yq -r '.spec.chart' "$manifest")" \
              --repo "$(yq -r '.spec.repo' "$manifest")" \
              --version "$(yq -r '.spec.version' "$manifest")" \
              --namespace monitoring -f "/tmp/values-$file.yaml" > "/tmp/$file.yaml"
          done
          kubectl kustomize deploy/monitoring > /tmp/monitoring.yaml
          # HelmChart is k3s's own kind, with no schema in kubeconform's catalog;
          # what it installs is validated through the helm renders above.
          ./kubeconform -strict -summary -skip HelmChart \
            /tmp/monitoring.yaml /tmp/prometheus.yaml /tmp/grafana.yaml

      - name: Hold Monitoring to the Design
        run: |
          # No Kubernetes Secrets: Grafana's password and the GitHub token come
          # from Parameter Store through the node's role.
          ! grep -n '^kind: Secret' /tmp/monitoring.yaml /tmp/prometheus.yaml /tmp/grafana.yaml
          # Nothing is exposed off the node; the owner uses the SSM tunnel.
          ! grep -nE '^kind: Ingress|type: (LoadBalancer|NodePort)' \
            /tmp/monitoring.yaml /tmp/prometheus.yaml /tmp/grafana.yaml

  # ── Publish the Backend Image ───────────────────────────────────────────────
  # On main only, and only after the job above built the image and proved it
  # imports. The tag is the commit SHA and nothing else: deploy.yml sets the
  # overlay to that SHA and the deploy record in DynamoDB names it, so a
  # running pod traces back to one commit. A moving tag would make a rollback
  # a race with whatever it points at by the time the node pulls.
  publish:
    name: Publish Backend Image
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the Image Name
        # GHCR rejects an upper-case path, and this owner has capitals.
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/second-brain-backend" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        # amd64 only: the node is an m7i-flex.large. A multi-arch build would
        # double the time for an image nothing else pulls.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # ── Next.js Frontend Verification ───────────────────────────────────────────
  nextjs-check:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Next.js App
        run: |
          cd frontend
          npm run lint --if-present

      - name: Build Next.js Production App
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
